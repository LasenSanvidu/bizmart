allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("stopGradleDaemon") {
    doLast {
        exec {
            commandLine "gradlew", "--stop"
        }
    }
}

tasks.register("clean", Delete) {
    dependsOn "stopGradleDaemon"
    delete rootProject.buildDir
}
 dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'  // Ensure using a compatible version
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.10'  // If using Kotlin
    }