plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'  // Firebase services plugin
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.myapp"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.bizmart.myapp" // Change to your unique application ID
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
         multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// Ensure that Firebase and other dependencies are added to your project in the dependencies section
dependencies {
    implementation 'com.google.firebase:firebase-analytics:21.2.0'  // Add Firebase Analytics (Example)
    implementation 'com.google.firebase:firebase-auth:21.2.0'      // Firebase Authentication
    implementation 'com.google.firebase:firebase-firestore:24.0.0' // Firestore
    implementation 'com.google.firebase:firebase-messaging:23.1.0' // Firebase Cloud Messaging
    implementation 'com.google.firebase:firebase-crashlytics:18.2.0' // Firebase Crashlytics (Optional)
    implementation 'com.android.tools:desugar_jdk_libs:1.1.5' // Required for Java 8+ APIs
    implementation 'androidx.multidex:multidex:2.0.1' // Multidex support (if needed)
    // Add any other Firebase dependencies you are using in your app
}

apply plugin: 'com.google.gms.google-services'  // Ensure the Google Services plugin is applied at the end
